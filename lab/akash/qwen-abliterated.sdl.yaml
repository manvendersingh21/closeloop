---
# Test LLM on Akash: huihui-ai/Huihui-Qwen3.5-9B-abliterated served by vLLM (OpenAI-compatible).
# Replace <VLLM_API_KEY> before deploying; every request must send "Authorization: Bearer <key>".
version: "2.0"

services:
  qwen:
    image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    command:
      - bash
      - "-c"
    args:
      - >-
        vllm serve huihui-ai/Huihui-Qwen3.5-9B-abliterated
        --served-model-name qwen-abliterated
        --max-model-len 16384
        --gpu-memory-utilization 0.90
        --api-key "$VLLM_API_KEY"
        --host 0.0.0.0 --port 8000
    env:
      - VLLM_API_KEY=<VLLM_API_KEY>
    expose:
      - port: 8000
        as: 80
        to:
          - global: true
    params:
      storage:
        shm:
          mount: /dev/shm

profiles:
  compute:
    qwen:
      resources:
        cpu:
          units: 8
        memory:
          size: 32Gi
        storage:
          - size: 80Gi
          - name: shm
            size: 10Gi
            attributes:
              class: ram
              persistent: false
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: h100
                - model: a100
                - model: l40s
                - model: a6000
                - model: rtxa6000
                - model: a40
  placement:
    dcloud:
      pricing:
        qwen:
          denom: uact
          amount: 1000000

deployment:
  qwen:
    dcloud:
      profile: qwen
      count: 1
