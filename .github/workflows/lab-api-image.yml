name: lab-api image

on:
  push:
    paths: ["lab/api/**", ".github/workflows/lab-api-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: lab/api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/closeloop-lab-api:0.1.0
            ghcr.io/${{ github.repository_owner }}/closeloop-lab-api:${{ github.sha }}
