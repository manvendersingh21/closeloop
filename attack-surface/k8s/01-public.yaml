# The public-facing mock HTTP service. Its ServiceAccount (public-app-sa)
# is what carries the RBAC escape (see 05-rbac-escape.yaml): the token
# auto-mounted into this pod has far more power than a public app needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-app-sa
  namespace: public
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-app
  namespace: public
spec:
  replicas: 1
  selector:
    matchLabels: { app: public-app }
  template:
    metadata:
      labels: { app: public-app }
    spec:
      serviceAccountName: public-app-sa
      containers:
        - name: whoami
          image: traefik/whoami
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: public-app
  namespace: public
spec:
  selector: { app: public-app }
  ports: [{ port: 80, targetPort: 80 }]
