---
version: "2.0"

# Level 2: Juice Shop moves to internal-only. A hardened reverse proxy
# (stock nginx:alpine, no custom image/registry needed — config is
# generated at container start from the command below) sits in front of
# it: HTTP Basic Auth, CSP, hidden Server/version banner, no wildcard
# CORS, HSTS.
#
# THE DELIBERATE GAP: auth_basic only covers `location /` — the API
# routes the app's own frontend calls (/rest/, /api/, /socket.io/) were
# never put behind it. A realistic "we protected the page, not the API
# it calls" misconfiguration. Full app functionality (and every
# originally-intended vulnerability) is still reachable through those
# paths, with no password at all.

services:
  proxy:
    image: nginx:alpine
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        echo "ops:$APACHE_HASH" > /etc/nginx/.htpasswd
        cat > /etc/nginx/conf.d/default.conf <<'NGINXCONF'
        server {
            listen 80 default_server;
            server_tokens off;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
            add_header X-Content-Type-Options "nosniff" always;

            proxy_hide_header Server;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header X-Powered-By;

            # if we can tell this arrived over plain HTTP, send it to HTTPS
            # (Akash's edge already terminates TLS for this hostname)
            if ($http_x_forwarded_proto = "http") {
                return 301 https://$host$request_uri;
            }

            # THE GAP: these API paths are NOT behind auth_basic.
            location ~ ^/(rest|api|socket\.io)/ {
                proxy_pass http://juiceshop:3000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location / {
                auth_basic "Restricted";
                auth_basic_user_file /etc/nginx/.htpasswd;
                proxy_pass http://juiceshop:3000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
        NGINXCONF
        exec nginx -g 'daemon off;'
    env:
      - APACHE_HASH=$apr1$iw1wY2t9$iGX.K6eZHggqcPHzqgpe7.
    expose:
      - port: 80
        as: 80
        to:
          - global: true

  juiceshop:
    image: bkimminich/juice-shop
    expose:
      - port: 3000
        to:
          - service: proxy

profiles:
  compute:
    proxy:
      resources:
        cpu:
          units: 0.3
        memory:
          size: 256Mi
        storage:
          size: 256Mi
    juiceshop:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 536Mi
        storage:
          size: 1Gi
  placement:
    dcloud:
      pricing:
        proxy:
          denom: uakt
          amount: 1000
        juiceshop:
          denom: uakt
          amount: 1000

deployment:
  proxy:
    dcloud:
      profile: proxy
      count: 1
  juiceshop:
    dcloud:
      profile: juiceshop
      count: 1
